<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-[#f7cbcb] flex justify-center items-center min-h-screen">
    <div class="w-full max-w-md bg-[#7e0505] p-[50px] rounded-[15px] border-[2] 
        border-solid border-[#060606]">

            <input  id="input" type="text" class="bg-[#f5b5b5] rounded-[10px] border-[1.5px] border-solid 
            border-[#0e0e0e] h-[40px] w-[265px] p-[5px]" >
            <button id="btn" class="bg-[#9b0b0b] rounded-[10px] border-[1.5px] border-solid border-[#121212] p-[5px] font-[13px]">Add task</button>
        </div>
        <div id="taskslist" class="flex flex-col my-[30px] rounded-[15px] font-[20px] gap-[10px] max-w-[400px]">

        </div>
    </div>

    <script src="./index.js"></script>
